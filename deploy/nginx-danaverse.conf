# Nginx — Danaverse Temple (static SPA)

# DNS:
#   A    @     → this host
#   A    www   → this host
#
#   sudo cp deploy/nginx-danaverse.conf /etc/nginx/sites-available/danaverse
#   sudo ln -sfn /etc/nginx/sites-available/danaverse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d danaverse.org -d www.danaverse.org
#
# Deploy:
#   rsync -a --delete dist/ /var/www/danaverse/

server {
    listen 80;
    listen [::]:80;
    server_name www.danaverse.org;
    return 301 https://danaverse.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name danaverse.org;

    root /var/www/danaverse;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /tx/<txid> and /<txid> are client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
